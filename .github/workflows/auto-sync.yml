name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0:00 自动执行（北京时间早 8:00）
  workflow_dispatch: # 允许在 Actions 网页动手点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        run: gh repo sync ${{ github.repository }} -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
